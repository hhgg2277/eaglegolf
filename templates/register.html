{% extends 'base.html' %}
{% block title %}회원가입 — EAGLE GOLF{% endblock %}
{% block content %}
<div class="auth-wrap">
  <div class="auth-card">
    <div class="auth-logo">🏌️ EAGLE GOLF</div>
    <div class="auth-subtitle">회원가입하고 골프 용품을 구매하세요</div>
    <form method="post">
      <div class="form-group"><label>이메일 *</label><input type="email" name="email" required placeholder="이메일 주소" autofocus/></div>
      <div class="form-group"><label>닉네임 *</label><input type="text" name="username" required placeholder="사용할 닉네임"/></div>
      <div class="form-group"><label>비밀번호 *</label><input type="password" name="password" required placeholder="비밀번호 (6자 이상)"/></div>
      <div class="form-group"><label>비밀번호 확인 *</label><input type="password" name="confirm" required placeholder="비밀번호 재입력"/></div>
      <button type="submit" class="btn-submit">회원가입</button>
    </form>
    <div class="auth-footer">이미 계정이 있으신가요? <a href="{{ url_for('login') }}">로그인</a></div>
  </div>
</div>
{% endblock %}
